[package]
name = "bevy-practice"
version = "0.1.5"
edition = "2024"

[dependencies]
bevy = "0.20.1"
encase = "0.12.0"
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
strum = { version = "0.28.0", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
